# SQLite 运行核心：路径使用 dsh 自身的 home 解析，与 sessions 同源。
# profile 覆盖此行时须重述 databaseFile 和 dataRoot。
- insert:
    - id: lepimemory-state
      name: "@dsh-external/dsh-lepimemory-state"
      config:
        databaseFile: !!js dshHomePath('lepimemory/runtime.sqlite')
        dataRoot: !!js dshHomePath('lepimemory')
